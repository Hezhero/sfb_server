server:
  port: 8001
  servlet:
    context-path: /admin
spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  freemarker:
    check-template-location: false
  jackson:
    time-zone: GMT+8
  data:
    redis:
      repositories:
        enabled: false
task:
  pool:
    # 核心线程池大小
    core-pool-size: 10
    # 最大线程数
    max-pool-size: 30
    # 活跃时间
    keep-alive-seconds: 60
    # 队列容量
    queue-capacity: 50

#七牛云
qiniu:
  # 文件大小 /M
  max-size: 15

#邮箱验证码有效时间/分钟
code:
  expiration: 5

#登录图形验证码有效时间/分钟
loginCode:
  # 是否开启登录验证码校验，默认关闭（各环境可在对应 profile 的 yml 中覆盖为 true）
  enabled: false
  expiration: 2

#密码加密传输，前端公钥加密，后端私钥解密
rsa:
  private_key: ${RSA_PRIVATE_KEY:}
aes:
  #AES加密密钥
  encryptKey: ${AES_ENCRYPT_KEY:}

# sm.ms 图床的 token
smms:
  token: ${SMMS_TOKEN:}

mshop:
  # 配置
  version: 5.1
  apiUrl: http://127.0.0.1:8009/api

logging:
  level:
    com.junchen: DEBUG
    org.springframework.web: DEBUG
    com.github.binarywang.demo.wx.mp: DEBUG
    me.chanjar.weixin: DEBUG

mybatis-plus:
  check-config-location: true
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
      mapper-locations: classpath*:mapper/**/*Mapper.xml
# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
